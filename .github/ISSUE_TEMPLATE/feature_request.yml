name: Feature request
description: Suggest a focused improvement to Mochi.
title: "feature: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - CLI / UX
        - Local model / training
        - Coding agent
        - Blender / creative tools
        - Memory / privacy
        - VTuber / FlyBrain integration
        - Documentation
    validations:
      required: true