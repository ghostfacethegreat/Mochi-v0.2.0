<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="1380" viewBox="0 0 1560 1380" role="img" aria-labelledby="t d">
<title id="t">Mochi CLI terminal preview</title><desc id="d">A rendered preview of Mochi CLI welcome, status and Think mode output.</desc>
<defs><linearGradient id="top" x2="1" y2="1"><stop stop-color="#252438"/><stop offset="1" stop-color="#1a1b2a"/></linearGradient></defs>
<rect width="1560" height="1380" fill="#0f1119"/><rect x="72" y="48" width="1416" height="1284" rx="24" fill="#161823" stroke="#393a4e" stroke-width="2"/><path d="M96 48h1368a24 24 0 0 1 24 24v42H72V72a24 24 0 0 1 24-24" fill="url(#top)"/>
<circle cx="102" cy="80" r="8" fill="#ff6e7a"/><circle cx="132" cy="80" r="8" fill="#f2c160"/><circle cx="162" cy="80" r="8" fill="#6fcd91"/><text x="780" y="86" text-anchor="middle" fill="#cac8d7" font-size="16" font-family="Arial">Terminal — Mochi CLI</text>
<text x="102" y="135" fill="#b7a7f5" font-size="16" font-weight="bold" font-family="Arial">MOCHI / LOCAL SESSION</text><text x="1458" y="135" fill="#9a9bb1" text-anchor="end" font-size="16" font-family="Arial">v0.2.0 · LOCAL-FIRST</text><path d="M100 166H1460" stroke="#393a4e"/>
<g font-family="DejaVu Sans Mono, monospace" font-size="19">
<text x="108" y="222" fill="#9ddbc9" font-weight="bold">~/Developer/Mochi  $  mochi</text>
<rect x="108" y="246" width="526" height="100" rx="4" fill="none" stroke="#b7a7f5" stroke-width="2"/><text x="126" y="277" fill="#e8e4ef">│    (\_/)   MOCHI                            │</text><text x="126" y="310" fill="#f2a7c3">│    ( •ᴗ•)  small model · big helper energy  │</text><text x="126" y="343" fill="#b7a7f5">╰─────────────────────────────────────────────╯</text>
<text x="108" y="378" fill="#9a9bb1">Try: mochi setup · mochi status · mochi think "build a website"</text><text x="108" y="408" fill="#9a9bb1">Local data stays in ~/.mochi. Run mochi --help for all commands.</text>
<path d="M108 430H1452" stroke="#393a4e"/><text x="108" y="468" fill="#9ddbc9" font-weight="bold">~/Developer/Mochi  $  mochi status</text>
<rect x="108" y="490" width="876" height="232" rx="4" fill="none" stroke="#b7a7f5" stroke-width="2"/><text x="545" y="520" text-anchor="middle" fill="#b7a7f5">Mochi status</text>
<text x="126" y="555" fill="#e8e4ef">Version             0.2.0</text><text x="126" y="585" fill="#e8e4ef">Model target        ~14.5M parameters (20M-class target)</text><text x="126" y="615" fill="#e8c28f">Checkpoint          not trained yet</text><text x="126" y="645" fill="#e8e4ef">Memory store        ~/.mochi/memory.sqlite3</text><text x="126" y="675" fill="#e8e4ef">Training examples   128</text><text x="126" y="705" fill="#9ddbc9">Think mode          enabled</text>
<text x="108" y="758" fill="#e8c28f">! Mochi Tiny starts from random weights. Run `mochi train` after adding</text><text x="126" y="788" fill="#e8c28f">enough reviewed training text.</text>
<path d="M108 812H1452" stroke="#393a4e"/><text x="108" y="850" fill="#9ddbc9" font-weight="bold">~/Developer/Mochi  $  mochi think "Build a small Python API with tests"</text>
<rect x="108" y="874" width="300" height="92" rx="4" fill="none" stroke="#b7a7f5" stroke-width="2"/><text x="126" y="906" fill="#e8e4ef">│    (\_/)   MOCHI       │</text><text x="126" y="938" fill="#f2a7c3">│    ( •ᴗ•)  think mode  │</text>
<text x="108" y="1000" fill="#b7a7f5" font-weight="bold">Build / coding plan</text><text x="108" y="1030" fill="#9a9bb1">Build a small Python API with tests</text><text x="108" y="1068" fill="#9bd8e8" font-weight="bold">PLAN</text>
<text x="108" y="1098" fill="#e8e4ef">1  Inspect the target project and identify its language, entry points, and tests.</text><text x="108" y="1128" fill="#e8e4ef">2  Break the request into small changes; list files that will be created or edited.</text><text x="108" y="1158" fill="#e8e4ef">3  Implement the smallest working change and keep edits inside the workspace.</text><text x="108" y="1188" fill="#e8e4ef">4  Run the project’s existing tests or the narrowest relevant checks.</text><text x="108" y="1224" fill="#9bd8e8" font-weight="bold">CHECKS</text><text x="108" y="1254" fill="#e8e4ef">1  Review the diff ·  2  Run tests and report failures ·  3  Keep a rollback copy.</text><text x="108" y="1284" fill="#e8c28f">! Arbitrary shell commands from model output are not executed automatically.</text>
</g>
<text x="108" y="1308" fill="#9ddbc9" font-family="Arial" font-size="16" font-weight="bold">● READY</text><text x="1452" y="1308" fill="#9a9bb1" text-anchor="end" font-family="Arial" font-size="16">PRIVATE · LOCAL · CUSTOMIZABLE</text>
